name: Finite scientific checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Tests, fresh finite replay, and retained-value comparison
        shell: bash
        run: |
          mkdir -p check-output
          timeout --signal=TERM --kill-after=10s 240s bash -c '
            set -euo pipefail
            ulimit -t 180
            ulimit -v 2441407
            python -B -m unittest discover -s tests -v 2>&1 | tee check-output/unit-tests.txt
            python -B reproduce.py --output check-output/reproduced 2>&1 | tee check-output/replay.txt
            python -B verify.py --output check-output/reproduced 2>&1 | tee check-output/comparison.txt
          '
      - name: Upload raw output even when a check fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finite-check-output
          path: check-output/
          if-no-files-found: warn
          retention-days: 14
